spring:
  profiles:
    active: "@spring.profile@"
  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: NON_ABSENT
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:mysql://localhost:3306/odonto_db
    username: root
    password: root
  web:
    locale: pt_BR
    resources:
      add-mappings: true
  main:
    banner-mode: "off"
springdoc:
  cache:
    disabled: true
  swagger-ui:
    use-root-path: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
app:
  version: "@project.version@"
  name: "@project.name@"
  description: "@project.description@"
server:
  servlet:
    context-path: /odontomanager-api
---
spring:
  config:
    activate:
      on-profile: prd
---
spring:
  config:
    activate:
      on-profile: sta
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev
---
# Gera o DDL das entidades em target/ddl/schema.sql e encerra, sem alterar o banco.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,ddl
spring:
  config:
    activate:
      on-profile: ddl
  main:
    web-application-type: none
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: target/ddl/schema.sql
      hibernate.hbm2ddl.schema-generation.script.append: false
      hibernate.hbm2ddl.delimiter: ";"
